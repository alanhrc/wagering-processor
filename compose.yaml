name: wagering-processor

services:
  postgres:
    image: postgres:16-alpine
    restart: no
    environment:
      POSTGRES_USER: ${DB_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_POSTGRES_NAME:-wagering_db}
    volumes:
      - ./.volumes/postgres:/var/lib/postgresql/data
    ports:
      - '${DB_POSTGRES_HOST:-0.0.0.0}:${DB_POSTGRES_PORT:-5436}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_POSTGRES_USER:-postgres} -d ${DB_POSTGRES_NAME:-wagering_db}']
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:latest
    restart: no
    environment:
      LOCALSTACK_SERVICES: ${LOCALSTACK_SERVICES:-sqs}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    ports:
      - '${LOCALSTACK_PORT:-4566}:4566'
    volumes:
      - ./.volumes/localstack:/var/lib/localstack
    healthcheck:
      test: ['CMD-SHELL', 'awslocal sqs list-queues >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 20

  sqs-init:
    image: localstack/localstack:latest
    restart: no
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ./scripts/localstack:/scripts:ro
    entrypoint: ['/bin/bash', '-c']
    command: ['bash /scripts/init-sqs.sh']
