name: wagering-processor

services:
  postgres:
    image: postgres:16-alpine
    restart: no
    environment:
      POSTGRES_USER: ${DB_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_POSTGRES_NAME:-wagering_db}
    volumes:
      - ./.volumes/postgres:/var/lib/postgresql/data
    ports:
      - '${DB_POSTGRES_BIND_HOST:-127.0.0.1}:${DB_POSTGRES_PORT:-5436}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_POSTGRES_USER:-postgres} -d ${DB_POSTGRES_NAME:-wagering_db}']
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:latest
    restart: no
    environment:
      LOCALSTACK_SERVICES: ${LOCALSTACK_SERVICES:-sqs}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    ports:
      - '${LOCALSTACK_PORT:-4566}:4566'
    volumes:
      - ./.volumes/localstack:/var/lib/localstack
    healthcheck:
      test: ['CMD-SHELL', 'awslocal sqs list-queues >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 20

  sqs-init:
    image: localstack/localstack:latest
    restart: no
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ./scripts/localstack:/scripts:ro
    entrypoint: ['/bin/bash', '-c']
    command: ['bash /scripts/init-sqs.sh']

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: no
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: 'true'
      KEYCLOAK_LOAD_CLIENT_SECRET: ${KEYCLOAK_LOAD_CLIENT_SECRET:?Set KEYCLOAK_LOAD_CLIENT_SECRET in .env}
      KEYCLOAK_SWAGGER_REDIRECT_URI: ${KEYCLOAK_SWAGGER_REDIRECT_URI:-http://localhost:3000/docs/oauth2-redirect.html}
      KEYCLOAK_API_ORIGIN: ${KEYCLOAK_API_ORIGIN:-http://localhost:3000}
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT:-8080}:8080'
    volumes:
      - ./.volumes/keycloak:/opt/keycloak/data
      - ./scripts/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/9000; printf ''GET /health/ready HTTP/1.0\r\n\r\n'' >&3; grep -q ''200'' <&3"']
      interval: 5s
      timeout: 5s
      retries: 40
