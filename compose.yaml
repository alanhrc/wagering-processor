name: wagering-processor

services:
  postgres:
    image: postgres:16-alpine
    restart: no
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${DB_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_POSTGRES_DB:-wagering_db}
    volumes:
      - ./.volumes/postgres:/var/lib/postgresql/data
    ports:
      - '${DB_POSTGRES_HOST:-0.0.0.0}:${DB_POSTGRES_PORT:-5436}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_POSTGRES_USER:-wagering_db} -d ${DB_POSTGRES_DB:-wagering_db}']
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:latest
    restart: no
    env_file:
      - path: .env
        required: false
    environment:
      LOCALSTACK_SERVICES: ${LOCALSTACK_SERVICES:-sqs}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-localstack}
    ports:
      - '${LOCALSTACK_PORT:-4566}:4566'
    volumes:
      - ./.volumes/localstack:/var/lib/localstack
